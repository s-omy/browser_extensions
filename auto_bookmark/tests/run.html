<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>自動テスト | ブックマーク整理 by Gemini</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; margin: 0; padding: 24px; background: #0d1117; color: #c9d1d9; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.hint { color: #8b949e; font-size: 13px; margin: 0 0 16px; }
  #summary { font-size: 15px; margin: 0 0 18px; font-weight: bold; }
  .suite { margin-bottom: 16px; }
  .suite h2 { font-size: 13px; margin: 0 0 4px; color: #8b949e; font-weight: normal; }
  .case { padding: 3px 8px; border-radius: 4px; margin: 2px 0; font-size: 13px; white-space: pre-wrap; }
  .pass { color: #3fb950; }
  .fail { background: #2a1214; color: #ff7b72; }
  .fail .msg { display: block; margin-top: 2px; color: #ffa198; }
  .fail .stack { display: block; margin-top: 2px; color: #8b949e; font-size: 11px; white-space: pre-wrap; }
  .ms { color: #6e7681; }
</style>
</head>
<body>
  <h1>🧪 自動テスト</h1>
  <p class="hint">chrome.* API と AI API（fetch。Gemini形式・OpenAI互換形式の両方）をすべてモックして、実際の各モジュールを import して検証します。実 Chrome・実際の外部APIへは一切アクセスしません。数十秒かかります。</p>
  <div id="root">実行中…</div>

<script type="module">
  import { runAll } from "./lib/assert.js";
  import "./specs/unit.spec.js";
  import "./specs/keywords.spec.js";
  import "./specs/reconcile.spec.js";
  import "./specs/gemini-client.spec.js";
  import "./specs/openai-compatible.spec.js";
  import "./specs/background.spec.js";
  import "./specs/settings.spec.js";
  import "./specs/analyze.spec.js";
  import "./specs/relocate.spec.js";
  import "./specs/knowledge.spec.js";

  const results = await runAll();
  window.__testResults = results; // ブラウザの開発者ツール／自動操作から読めるように公開する

  const pass = results.filter(r => r.ok).length;
  const fail = results.length - pass;
  document.title = (fail === 0 ? "✅" : "❌") + " 自動テスト（" + pass + "/" + results.length + "）";

  const bySuite = new Map();
  for (const r of results) {
    if (!bySuite.has(r.suite)) bySuite.set(r.suite, []);
    bySuite.get(r.suite).push(r);
  }

  // ②③④のテストは options.html を document.body へ読み込むため、途中で #root ごと消えている。
  // id で拾わず、document.body 自体（参照は常に有効）を最後にまとめて差し替える。
  const root = document.createElement("div");

  const summary = document.createElement("div");
  summary.id = "summary";
  summary.style.color = fail === 0 ? "#3fb950" : "#ff7b72";
  summary.textContent = (fail === 0 ? "✅ " : "❌ ") + pass + " / " + results.length + " 件成功" + (fail > 0 ? "（失敗 " + fail + " 件）" : "");
  root.append(summary);

  for (const [suiteName, cases] of bySuite) {
    const suiteEl = document.createElement("div");
    suiteEl.className = "suite";
    const suitePass = cases.filter(c => c.ok).length;
    const h2 = document.createElement("h2");
    h2.textContent = suiteName + "（" + suitePass + "/" + cases.length + "）";
    suiteEl.append(h2);
    for (const c of cases) {
      const div = document.createElement("div");
      div.className = "case " + (c.ok ? "pass" : "fail");
      const label = document.createElement("span");
      label.textContent = (c.ok ? "✓ " : "✗ ") + c.name + " ";
      const ms = document.createElement("span");
      ms.className = "ms";
      ms.textContent = "(" + c.ms + "ms)";
      div.append(label, ms);
      if (!c.ok) {
        const msg = document.createElement("span");
        msg.className = "msg";
        msg.textContent = c.error;
        div.append(msg);
        if (c.stack) {
          const stack = document.createElement("span");
          stack.className = "stack";
          stack.textContent = c.stack;
          div.append(stack);
        }
      }
      suiteEl.append(div);
    }
    root.append(suiteEl);
  }

  document.body.replaceChildren(root);

  console.log(fail === 0 ? "ALL TESTS PASSED (" + pass + ")" : "TESTS FAILED: " + fail + " / " + results.length);
  if (fail > 0) console.table(results.filter(r => !r.ok));
</script>
</body>
</html>
